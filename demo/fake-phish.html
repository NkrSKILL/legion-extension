<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Выплата компенсации — подтвердите вход</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    .timer { color: red; font-weight: bold; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; }
  </style>
</head>
<body>
  <h1>Получите компенсацию от государства</h1>
  <p class="timer">Осталось 3 минуты</p>
  <p>Срочно подтвердите аккаунт. Введите пароль от Госуслуг для участия в выплате.</p>
  <form>
    <label>Логин</label>
    <input type="text" name="login" />
    <label>Пароль от Госуслуг</label>
    <input type="password" name="password" placeholder="Пароль" />
    <button type="submit">Подтвердить и получить выплату</button>
  </form>
  <p><small>Это учебная демо-страница для теста Legion. Не вводите реальные данные.</small></p>
</body>
</html>
