<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вход в личный кабинет</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; }
    button { width: 100%; padding: 10px; }
  </style>
</head>
<body>
  <h1>Вход</h1>
  <p>Обычный вход без таймеров и «выплат». Неизвестный сайт + пароль → жёлтая метка Legion (без красного оверлея).</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" autocomplete="email" />
    <label>Пароль</label>
    <input type="password" name="password" autocomplete="current-password" />
    <button type="submit">Войти</button>
  </form>
  <p><small>Демо жёлтого режима (tier A).</small></p>
</body>
</html>
