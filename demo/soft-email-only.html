<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Подписка на новости</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; }
    button { width: 100%; padding: 10px; }
  </style>
</head>
<body>
  <h1>Подписка</h1>
  <p>Оставьте email, чтобы получать новости. Без пароля и без доп.сигналов — жёлтого быть не должно.</p>
  <form>
    <label>Email</label>
    <input type="email" name="email" />
    <button type="submit">Подписаться</button>
  </form>
</body>
</html>
