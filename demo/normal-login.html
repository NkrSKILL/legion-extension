<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вход в аккаунт — обычный сайт</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; }
    button { width: 100%; padding: 10px; }
  </style>
</head>
<body>
  <h1>Вход</h1>
  <p>Войдите в свой аккаунт на example-shop.test</p>
  <form>
    <label>Email</label>
    <input type="email" name="email" />
    <label>Пароль</label>
    <input type="password" name="password" />
    <button type="submit">Войти</button>
  </form>
  <p><small>Учебная «нормальная» страница: форма есть, манипуляций нет — предупреждения быть не должно.</small></p>
</body>
</html>
